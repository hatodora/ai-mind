<meta charset="utf-8">
<style>
  body { margin:0; background:transparent;
         font-family: "Hiragino Sans","Noto Sans JP",sans-serif; }
  .cell { width:180px; height:180px; display:flex; align-items:center; justify-content:center; }
  .cell svg { width:150px; height:150px; }
  .ico { fill:none; stroke:#24261f; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .ico--accent { stroke:#0a8f8b; }
  .ico--danger { stroke:#d43d3d; }
  .mascot { width:150px; }
  #vignette { width:520px; height:auto; }
</style>

<div class="cell" id="ico-phone"><svg class="ico" viewBox="0 0 64 64"><rect x="19" y="5" width="26" height="54" rx="5"/><path d="M28 11h8"/><path d="M28 53h8"/></svg></div>
<div class="cell" id="ico-browser"><svg class="ico" viewBox="0 0 64 64"><rect x="5" y="12" width="54" height="38" rx="4"/><path d="M5 22h54"/><path d="M12 17h.01"/><path d="M18 17h.01"/><path d="M24 17h.01"/><path d="M22 57h20"/><path d="M32 50v7"/></svg></div>
<div class="cell" id="ico-wifi"><svg class="ico" viewBox="0 0 64 64"><path d="M8 24a34 34 0 0 1 48 0"/><path d="M17 34a22 22 0 0 1 30 0"/><path d="M25.5 43.5a11 11 0 0 1 13 0"/><circle cx="32" cy="52" r="2.4" fill="#24261f" stroke="none"/></svg></div>
<div class="cell" id="ico-clock"><svg class="ico" viewBox="0 0 64 64"><circle cx="32" cy="32" r="24"/><path d="M32 17v15l10 6"/></svg></div>
<div class="cell" id="ico-mail"><svg class="ico" viewBox="0 0 64 64"><rect x="7" y="15" width="50" height="34" rx="4"/><path d="M7 19l25 17 25-17"/></svg></div>
<div class="cell" id="ico-none"><svg class="ico" viewBox="0 0 64 64" style="stroke:#9ba193"><circle cx="32" cy="32" r="25"/><path d="M23 23l18 18M41 23L23 41"/></svg></div>
<div class="cell" id="ico-check"><svg class="ico ico--accent" viewBox="0 0 64 64"><circle cx="32" cy="32" r="25"/><path d="M20 33l8 9 17-20"/></svg></div>
<div class="cell" id="ico-cross"><svg class="ico ico--danger" viewBox="0 0 64 64"><circle cx="32" cy="32" r="25"/><path d="M23 23l18 18M41 23L23 41"/></svg></div>

<div id="vignette">
  <svg viewBox="0 0 220 132" style="width:520px">
    <g class="ico" stroke-width="1.8">
      <rect x="8" y="20" width="86" height="30" rx="9"/>
      <path d="M104 35h22"/><path d="M119 29l7 6-7 6"/>
      <rect x="134" y="20" width="78" height="30" rx="15" class="ico--accent"/>
      <g transform="translate(46,46) scale(.66)">
        <path d="M27 37V17a4.5 4.5 0 0 1 9 0v13"/>
        <path d="M36 27a3.8 3.8 0 0 1 7.6 0v4"/>
        <path d="M43.6 29a3.8 3.8 0 0 1 7.6 0v11c0 8.5-5.6 15-13.6 15h-3.4c-4.6 0-7.2-2-9.8-5.8l-7-10.2a4.2 4.2 0 0 1 6.6-5.2L27 43"/>
      </g>
    </g>
    <text x="51" y="39" text-anchor="middle" font-size="9.5" fill="#24261f">いまの仕事の不満</text>
    <text x="173" y="39" text-anchor="middle" font-size="10" font-weight="700" fill="#0a8f8b">? わからない</text>
    <text x="51" y="118" text-anchor="middle" font-size="8.5" fill="#9ba193">① ノードを選ぶ</text>
    <text x="173" y="118" text-anchor="middle" font-size="8.5" fill="#9ba193">② 押す</text>
  </svg>
</div>
